<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iPhone preview</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
  }

  /* iPhone Mockup */
  .iphone {
    width: 350px;
    height: 680px; /* 👉 SHORT HEIGHT */
    background: #000;
    border-radius: 48px;
    padding: 12px;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  /* Notch */
  .notch {
    width: 180px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* Screen area */
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 36px;
    overflow: hidden;
    background: #111;
    margin-top: 8px;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

<div class="iphone">
  <div class="notch"></div>
  <div class="screen">
    <!-- 👉 YAHAN TUMHARA PROJECT LOAD HOGA -->
    <iframe src="project/index.html"></iframe>
  </div>
</div>

</body>
</html>
